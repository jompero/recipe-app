name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Firebase Emulator needs Java; firebase-tools 15 requires JDK 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Starts the Auth + Firestore emulators (demo-recipe-app), runs the tests, stops them.
      - run: npm run test:ci
      # End-to-end (US-5.5): Chromium with its system libraries, then the app at phone size
      # against fresh, empty emulators.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - run: npm run build
